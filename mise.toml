[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
helm = "4.3.2"

[tasks.check]
description = "Format, vet, lint, test, and Helm lint"
run = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "golangci-lint run --timeout=5m ./...",
  "go test ./...",
  "helm lint charts/openebs-zfs-cleanup-controller",
]
